  /* ==========================================================================
     TOKENS — identité « salle d'opérations ». Volontairement sans lien avec la
     charte « carte marine » de la carte 2D. La scène 3D lit ces mêmes tokens.
     ========================================================================== */
  :root{
    --bg-0:#03060C; --bg-1:#07101D; --bg-2:#0D1727;
    --glass:rgba(8,15,27,.74); --glass-hi:rgba(12,22,38,.92); --glass-row:rgba(120,170,230,.05);
    --line:rgba(120,170,230,.13); --line-hi:rgba(120,170,230,.26);
    --t1:#E6EEF9; --t2:#97A9C2; --t3:#5A6D87;
    --signal:#3CD7FF; --signal-soft:rgba(60,215,255,.13);
    --ok:#3DF5A6; --ok-soft:rgba(61,245,166,.12);
    --warn:#FFC53D; --warn-soft:rgba(255,197,61,.13);
    --high:#FF8A3D; --crit:#FF3D71; --crit-soft:rgba(255,61,113,.13);
    /* scène */
    --sea:#040A14; --land-low:#0A1626; --land-high:#22597E; --contour:#5BB6E6;
    --grid:#2BE3A0; --coast:#3CD7FF; --side-top:#0A1525; --side-bot:#02050A;
    --sat-ink:#DDE8F6; --vignette:.5; --bloom:1.15; --glow-bg:#0B2238;

    --font-display:'Chakra Petch', 'Barlow', system-ui, sans-serif;
    --font-ui:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --r-panel:12px; --r-card:9px; --r-chip:5px;
    --blur:14px;
    color-scheme:dark;
  }
  :root[data-theme="clair"]{
    --bg-0:#D5DFEA; --bg-1:#E9EFF6; --bg-2:#FFFFFF;
    --glass:rgba(255,255,255,.80); --glass-hi:rgba(255,255,255,.95); --glass-row:rgba(20,60,120,.04);
    --line:rgba(25,55,100,.12); --line-hi:rgba(25,55,100,.24);
    --t1:#0C1A2D; --t2:#43566F; --t3:#7C8CA3;
    --signal:#1E6BFF; --signal-soft:rgba(30,107,255,.10);
    --ok:#0E9F63; --ok-soft:rgba(14,159,99,.10);
    --warn:#D18E00; --warn-soft:rgba(209,142,0,.12);
    --high:#E2641A; --crit:#DD2160; --crit-soft:rgba(221,33,96,.10);
    --sea:#BCD3EB; --land-low:#E2E8EF; --land-high:#8195AD; --contour:#6F86A3;
    --grid:#1E6BFF; --coast:#1E6BFF; --side-top:#C3D1E1; --side-bot:#93A7BE;
    --sat-ink:#1D2C44; --vignette:.18; --bloom:.22; --glow-bg:#FFFFFF;
    color-scheme:light;
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg-0)}
  body{color:var(--t1);font:400 14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #scene.drag{cursor:grabbing}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .cap{font:600 10.5px/1.2 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--t3)}
  button{font:inherit;color:inherit}
  svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

  .glass{position:absolute;z-index:20;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-panel);
         backdrop-filter:blur(var(--blur)) saturate(1.3);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.3)}
  .reveal{opacity:0;transition:opacity .7s cubic-bezier(.2,.7,.3,1)}
  body.ready .reveal{opacity:1}
  body.ready .d1{transition-delay:.05s} body.ready .d2{transition-delay:.15s}
  body.ready .d3{transition-delay:.25s} body.ready .d4{transition-delay:.35s}

  /* — en-tête — */
  header{position:fixed;top:0;left:0;right:0;height:56px;z-index:30;display:flex;align-items:center;gap:14px;padding:0 14px;
         background:linear-gradient(var(--glass-hi),var(--glass));border-bottom:1px solid var(--line);white-space:nowrap;
         backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--t1);line-height:1}
  .brand b{font:700 16px/1 var(--font-display);letter-spacing:.24em}
  .brand small{font:500 10.5px/1 var(--font-mono);color:var(--t3);letter-spacing:.04em}
  .search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;width:min(320px,22vw);border:1px solid var(--line);
          border-radius:8px;background:var(--glass-row);color:var(--t3)}
  .search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--t1);font:400 13.5px var(--font-ui)}
  .search input::placeholder{color:var(--t3)}
  .kbd{font:500 10.5px var(--font-mono);border:1px solid var(--line-hi);border-radius:4px;padding:1px 5px;color:var(--t3)}
  .chip-zone{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px 0 5px;border:1px solid var(--line);border-radius:9px;background:var(--glass-row)}
  .chip-zone .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn)}
  .chip-zone b{display:block;font:600 13px/1.1 var(--font-display);letter-spacing:.08em}
  .chip-zone span span{font:400 11px/1.2 var(--font-mono);color:var(--t3)}
  .sp{flex:1}
  .pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;font:600 11px/1 var(--font-mono);letter-spacing:.06em}
  .pill.sim{background:var(--ok-soft);color:var(--ok)}
  .pill.proto{border:1px solid var(--crit);color:var(--crit);border-radius:var(--r-chip)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:ping 1.8s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 currentColor}100%{box-shadow:0 0 0 7px transparent}}
  .hbtn{height:34px;display:inline-flex;align-items:center;gap:7px;padding:0 11px;border-radius:8px;border:1px solid var(--line);
        background:var(--glass-row);cursor:pointer;color:var(--t2);font:500 13px var(--font-ui);text-decoration:none}
  .hbtn:hover{color:var(--t1);border-color:var(--line-hi)}

  /* — fil de veille (gauche) — */
  #feed{top:70px;left:14px;bottom:14px;width:300px;display:flex;flex-direction:column;overflow:hidden}
  .ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px}
  .ph h2{margin:0;font:700 12px/1 var(--font-display);letter-spacing:.2em;text-transform:uppercase}
  .ph .mono{font-size:11px;color:var(--t3)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 12px}
  .stat{border:1px solid var(--line);border-radius:var(--r-card);padding:8px 6px 7px;text-align:center;background:var(--glass-row)}
  .stat b{display:block;font:600 20px/1.1 var(--font-mono)}
  .stat span{font:600 9.5px/1 var(--font-display);letter-spacing:.14em;color:var(--t3)}
  .stat.alert b{color:var(--crit)}
  #feedList{flex:1;overflow:auto;padding:0 10px 12px;scrollbar-width:thin}
  .ev{padding:10px 8px;border-top:1px solid var(--line);border-radius:6px}
  .ev.click{cursor:pointer} .ev.click:hover{background:var(--glass-row)}
  .ev.new{animation:flash 1.8s ease-out}
  @keyframes flash{0%{background:var(--signal-soft)}100%{background:transparent}}
  .ev .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .tag{font:700 9.5px/1 var(--font-mono);letter-spacing:.08em;padding:3px 6px;border-radius:4px;white-space:nowrap}
  .tag.jwc{background:var(--warn-soft);color:var(--warn)} .tag.press{background:var(--signal-soft);color:var(--signal)}
  .tag.sat{background:var(--ok-soft);color:var(--ok)} .tag.ais{color:var(--t2);border:1px solid var(--line-hi)}
  .tag.alert{background:var(--crit-soft);color:var(--crit)} .tag.sys{background:var(--glass-row);color:var(--t2);border:1px solid var(--line)}
  .tag.off{color:var(--high);border:1px dashed var(--high)}
  .ev .t{font:400 11px var(--font-mono);color:var(--t3);margin-left:auto}
  .ev p{margin:0;font:500 13px/1.35 var(--font-ui);color:var(--t1)}
  .ev small{display:block;margin-top:3px;font:400 10.5px/1.35 var(--font-mono);color:var(--t3)}
  .ev a{color:inherit;text-decoration:none} .ev a:hover{color:var(--signal)}

  /* — indicateurs — */
  #kpis{position:absolute;z-index:20;top:70px;left:328px;right:368px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .kpi{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border-radius:var(--r-panel);background:var(--glass);border:1px solid var(--line);
       backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));min-width:0}
  .kpi .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--signal-soft);color:var(--signal)}
  .kpi .ic svg{width:19px;height:19px}
  .kpi.w .ic{background:var(--warn-soft);color:var(--warn)} .kpi.g .ic{background:var(--ok-soft);color:var(--ok)}
  .kpi.a{border-color:var(--crit)} .kpi.a .ic{background:var(--crit-soft);color:var(--crit)}
  .kpi .l{font:500 12px/1.2 var(--font-ui);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .v{font:600 22px/1.15 var(--font-mono);margin-top:3px;white-space:nowrap}
  .kpi .v small{font-size:12px;color:var(--t3);font-weight:400}
  .kpi .s{font:400 11px/1.3 var(--font-mono);color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .s .up{color:var(--ok)} .kpi .s .bad{color:var(--crit)}
  .bar{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .6s}

  /* — dossier (droite) — */
  #dossier{top:70px;right:14px;bottom:14px;width:340px;overflow:auto;padding:16px;scrollbar-width:thin}
  .dh{display:flex;gap:12px;align-items:flex-start}
  .dh .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
  .dh .ic svg{width:24px;height:24px}
  .dh .k{font:600 10.5px/1 var(--font-display);letter-spacing:.16em;color:var(--signal)}
  .dh h1{margin:5px 0 3px;font:700 22px/1.1 var(--font-display);letter-spacing:.03em}
  .dh .co{font:400 11px var(--font-mono);color:var(--t3)}
  .status{display:flex;gap:10px;align-items:center;margin:12px 0 0;flex-wrap:wrap}
  .st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;font:600 11.5px/1 var(--font-ui)}
  .st.w{background:var(--warn-soft);color:var(--warn)} .st.n{color:var(--t3);font:400 11px var(--font-mono);padding:0}
  .ctx{font-size:13px;color:var(--t2);margin:10px 0 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .card{border:1px solid var(--line);border-radius:var(--r-card);padding:10px 11px;background:var(--glass-row)}
  .card .l{font:500 11.5px/1.2 var(--font-ui);color:var(--t2)}
  .card .v{font:600 22px/1.2 var(--font-mono);margin-top:3px}
  .card .v small{font-size:12px;color:var(--t3);font-weight:400}
  .card .v.s{font-size:14.5px;padding-top:6px}
  .sec{margin-top:16px}
  .sec .cap{display:flex;justify-content:space-between;margin-bottom:8px}
  .ladder{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
  .ladder div{height:26px;border-radius:4px;display:grid;place-items:center;font:600 12px var(--font-mono);color:var(--t3);background:var(--glass-row);border:1px solid var(--line)}
  .ladder div.on{color:var(--bg-0);border-color:transparent}
  .ladder div.cur{box-shadow:0 0 0 2px var(--bg-1),0 0 0 3.5px var(--t1)}
  .ladder div.susp{border:1px dashed var(--crit);color:var(--crit)}
  .lg{display:flex;justify-content:space-between;font:400 10.5px var(--font-mono);color:var(--t3);margin-top:6px}
  .lg b{color:var(--crit);font-weight:600}
  .premwrap{position:relative;margin-top:12px}
  .prem{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ok),var(--warn) 45%,var(--high) 75%,var(--crit));opacity:.35}
  .premwrap i{position:absolute;top:-3px;height:12px;border-radius:3px;border:2px solid var(--t1)}
  .rel{display:grid;grid-template-columns:1fr 60px;gap:9px 10px;align-items:center}
  .rel span{font:500 13px/1.2 var(--font-ui)} .rel small{display:block;font:400 10.5px var(--font-mono);color:var(--t3);margin-top:2px}
  .seg{display:flex;gap:3px} .seg i{flex:1;height:5px;border-radius:2px;background:var(--line-hi)}
  .seg.l3 i{background:var(--ok)} .seg.l1 i:first-child{background:var(--warn)} .seg.na{font:400 10.5px var(--font-mono);color:var(--t3);justify-content:flex-end}
  .seg.sim i{background:repeating-linear-gradient(90deg,var(--signal) 0 3px,transparent 3px 5px)}
  .pr{display:grid;grid-template-columns:118px 1fr 30px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0;color:var(--t2)}
  .pr .pw{height:5px;border-radius:3px;background:var(--line)} .pr .pv{height:100%;border-radius:3px;background:var(--warn)}
  .pr b{font:600 12px var(--font-mono);text-align:right;color:var(--t1)}
  ul.why{margin:0;padding-left:16px;font-size:13px;color:var(--t2)} ul.why li{margin:3px 0}
  .hl a{display:block;padding:8px 0;border-top:1px solid var(--line);color:var(--t1);text-decoration:none;font-size:13px}
  .hl a:hover{color:var(--signal)} .hl small{display:block;font:400 10.5px var(--font-mono);color:var(--t3);margin-top:2px}
  .stance{margin-top:16px;padding:10px 12px;border-radius:8px;background:var(--signal-soft);color:var(--t2);font-size:12.5px;border-left:2px solid var(--signal)}

  /* — exposition (bas) — */
  #fleet{left:328px;right:368px;bottom:14px;height:212px;display:flex;flex-direction:column;overflow:hidden;transition:height .35s}
  #fleet.min{height:48px}
  .fh{display:flex;align-items:center;gap:12px;padding:9px 12px 7px 14px}
  .fh h2{margin:0;font:700 12px/1 var(--font-display);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
  .tabs{display:flex;gap:2px;padding:3px;border-radius:8px;background:var(--glass-row);border:1px solid var(--line)}
  .tabs button{border:0;background:none;padding:5px 10px;border-radius:6px;font:500 12.5px var(--font-ui);color:var(--t2);cursor:pointer;white-space:nowrap}
  .tabs button.on{background:var(--bg-2);color:var(--t1)}
  .tabs button b{font:600 11px var(--font-mono);margin-left:5px;color:var(--t3)}
  .tabs button.al b{color:var(--crit)}
  .fh .tot{margin-left:auto;font:600 15px var(--font-mono);white-space:nowrap} .fh .tot small{font:400 11px var(--font-mono);color:var(--t3)}
  .ibtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:none;display:grid;place-items:center;color:var(--t2);cursor:pointer;flex:none}
  #fleet.min .ibtn svg{transform:rotate(180deg)}
  #fleetBody{flex:1;overflow:auto;padding:0 8px 8px;scrollbar-width:thin}
  table{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:13px}
  th{font:600 9.5px/1 var(--font-display);letter-spacing:.14em;color:var(--t3);text-transform:uppercase;text-align:left;padding:4px 8px;white-space:nowrap}
  th.r,td.r{text-align:right}
  td{padding:0 8px;height:33px;background:var(--glass-row);white-space:nowrap}
  td:first-child{border-radius:7px 0 0 7px} td:last-child{border-radius:0 7px 7px 0}
  tbody tr{cursor:pointer} tbody tr:hover td{background:var(--signal-soft)}
  tbody tr.sel td{background:var(--signal-soft);box-shadow:inset 0 1px 0 var(--signal),inset 0 -1px 0 var(--signal)}
  td .nm{font:600 13px var(--font-ui)} td .cr{font:400 10.5px var(--font-mono);color:var(--t3);margin-left:7px}
  .bdg{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 7px;border-radius:5px;font:600 10.5px var(--font-mono);white-space:nowrap}
  .bdg.ok{background:var(--ok-soft);color:var(--ok)} .bdg.ais{color:var(--t2);border:1px solid var(--line-hi)}
  .bdg.dark{background:var(--crit-soft);color:var(--crit)}
  .empty{padding:18px;text-align:center;color:var(--t3);font:400 12px var(--font-mono)}

  /* — barre d'outils de la scène + calques — */
  #tools{position:absolute;z-index:22;top:178px;right:380px;display:flex;flex-direction:column;gap:2px;padding:4px}
  #tools button{width:36px;height:36px;border:0;border-radius:8px;background:none;color:var(--t2);display:grid;place-items:center;cursor:pointer}
  #tools button:hover{background:var(--glass-row);color:var(--t1)}
  #tools button.on{color:var(--signal);background:var(--signal-soft)}
  #tools hr{border:0;border-top:1px solid var(--line);margin:3px 4px}
  #layers{top:178px;right:430px;width:280px;padding:14px 16px;display:none;z-index:23;background:var(--glass-hi)}
  #layers.open{display:block}
  #layers .cap{margin:14px 0 8px} #layers .cap:first-child{margin-top:0}
  .segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:8px;background:var(--glass-row);border:1px solid var(--line)}
  .segc button{border:0;background:none;padding:7px 0;border-radius:6px;font:600 11px var(--font-display);letter-spacing:.14em;color:var(--t3);cursor:pointer}
  .segc button.on{background:var(--bg-2);color:var(--t1)}
  .tg{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px;color:var(--t2);cursor:pointer;user-select:none}
  .tg input{appearance:none;width:30px;height:17px;border-radius:9px;background:var(--line-hi);position:relative;cursor:pointer;margin:0;flex:none;transition:background .2s}
  .tg input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--t1);transition:left .2s}
  .tg input:checked{background:var(--signal)} .tg input:checked::after{left:15px}
  .sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;color:var(--t2);margin:6px 0}
  .sl output{font:500 12px var(--font-mono);color:var(--t1)}
  .sl input{grid-column:1/-1;width:100%;accent-color:var(--signal)}

  /* — étiquettes posées sur la scène — */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  .lb{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;transition:opacity .35s}
  .lb.land{font:600 11px/1 var(--font-display);letter-spacing:.38em;color:var(--t2);text-shadow:0 0 8px var(--bg-0)}
  .lb.sea{font:500 10.5px/1 var(--font-mono);letter-spacing:.32em;color:var(--signal)}
  .lb.port{font:500 10.5px/1 var(--font-mono);letter-spacing:.08em;color:var(--t1);transform:translate(9px,-50%);text-shadow:0 0 6px var(--bg-0)}
  .lb.port::before{content:"";position:absolute;left:-9px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--t1);box-shadow:0 0 8px var(--signal)}
  
  .lb.strait{transform:translate(-50%,-100%);padding:5px 8px;border:1px solid var(--warn);border-radius:5px;background:var(--glass-hi);
             font:600 11px/1.25 var(--font-display);letter-spacing:.12em;color:var(--warn)}
  .lb.strait small{display:block;font:400 10px var(--font-mono);letter-spacing:0;color:var(--t2)}
  .lb.layer{transform:translate(-100%,-50%);padding-right:12px;text-align:right;font:600 10px/1.25 var(--font-display);letter-spacing:.2em;color:var(--t2)}
  .lb.layer small{display:block;font:400 9.5px var(--font-mono);letter-spacing:0;color:var(--t3)}
  .lb.layer::after{content:"";position:absolute;right:0;top:50%;width:7px;height:1px;background:currentColor}
  .lb.sat{transform:translate(22px,-50%);font:600 10px/1.3 var(--font-mono);letter-spacing:.08em;color:var(--t1)}
  .lb.sat small{display:block;color:var(--t3);font-weight:400}
  .lb.zone{font:600 10px/1 var(--font-mono);letter-spacing:.14em;color:var(--warn)}
  .lb.mk{transform:translate(14px,-50%);font:600 10.5px/1.2 var(--font-mono);color:var(--t1);padding:3px 6px;border-radius:4px;background:var(--glass-hi);border:1px solid var(--line-hi)}
  .lb.mk.ok{border-color:var(--ok);color:var(--ok)} .lb.mk.no{border-color:var(--crit);color:var(--crit)} .lb.mk.w{border-color:var(--warn);color:var(--warn)}
  .lb.hov{transform:translate(12px,-160%);font:600 11px var(--font-mono);color:var(--t1);background:var(--glass-hi);padding:3px 7px;border-radius:4px;border:1px solid var(--line-hi)}

  /* — fiche navire épinglée — */
  #leader{position:fixed;inset:0;pointer-events:none;z-index:24;width:100%;height:100%}
  #callout{position:fixed;z-index:25;width:252px;padding:12px 13px;display:none;background:var(--glass-hi);border:1px solid var(--line-hi);border-radius:10px;
           backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
  #callout .h{display:flex;align-items:center;gap:8px}
  #callout b{font:700 14px/1.2 var(--font-display);letter-spacing:.04em}
  #callout .x{margin-left:auto;cursor:pointer;color:var(--t3);border:0;background:none;padding:2px}
  #callout .row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--t2);margin-top:5px}
  #callout .row span:last-child{font:500 12px var(--font-mono);color:var(--t1)}
  #callout .n{font:400 10.5px var(--font-mono);color:var(--t3);margin-top:8px}
  #toast{position:fixed;z-index:40;left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;transition:all .4s;padding:10px 14px;border-radius:9px;
         background:var(--glass-hi);border:1px solid var(--crit);color:var(--t1);font:500 13px var(--font-ui);display:flex;gap:10px;align-items:center;pointer-events:none}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #nowebgl{position:fixed;inset:0;display:none;place-items:center;font:600 16px var(--font-display);letter-spacing:.1em}

  @media (max-width:1360px){ #feed{display:none} #kpis,#fleet{left:14px} }
  @media (max-width:900px){
    #dossier{top:auto;height:42vh;left:14px;right:14px;width:auto} #fleet,#tools,.search,.chip-zone span span,.pill.proto,.hbtn{display:none}
    #kpis{right:14px;grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Maquette 3D de la zone"></canvas>
<div id="labels"></div>
<svg id="leader"><polyline id="leaderLine" fill="none" stroke-width="1.2" points=""/></svg>

<header>
  <a class="brand" href="proteus-prototype.html" title="Revenir à la carte du monde">
    <svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 1.5 23 7.25v11.5L13 24.5 3 18.75V7.25z" fill="none" stroke="var(--signal)" stroke-width="1.6"/>
      <path d="M13 7 18 13l-5 6-5-6z" fill="var(--signal)" opacity=".9"/></svg>
    <span><b>PROTEUS</b><br><small>war-risk desk</small></span>
  </a>
  <label class="search"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>
    <input id="q" placeholder="Navire, armateur…" autocomplete="off"><span class="kbd">/</span></label>
  <div class="chip-zone" title="Une seule zone dans ce prototype">
    <span class="ic"><svg class="i" viewBox="0 0 16 16"><path d="M8 1.5 14.5 13.5h-13z"/><path d="M8 6v3.5M8 11.5v.1"/></svg></span>
    <span><b id="zName">—</b><span id="zSub">—</span></span>
  </div>
  <span class="sp"></span>
  <span class="pill proto" title="Données de zone réelles · flotte, satellites et contact sans AIS simulés">PROTOTYPE · FLOTTE SIMULÉE</span>
  <span class="pill sim" title="Rejeu accéléré à partir de l'instantané du 16/07"><span class="dot"></span>SIM <span id="clock">--:--</span> UTC <span id="rate">×230</span></span>
  <a class="hbtn" href="proteus-prototype.html"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2 2 10 0 12M8 2c-2 2-2 10 0 12"/></svg>Carte du monde</a>
</header>

<aside id="feed" class="glass reveal d2" aria-label="Fil de veille">
  <div class="ph"><h2>Fil de veille</h2><span class="mono" id="feedUpd">—</span></div>
  <div class="stats"><div class="stat"><b id="stSig">0</b><span>SIGNAUX</span></div><div class="stat"><b id="stSrc">—</b><span>SOURCES</span></div>
    <div class="stat" id="stAlBox"><b id="stAl">0</b><span>ALERTES</span></div></div>
  <div id="feedList"></div>
</aside>
<section id="kpis" class="reveal d1" aria-label="Indicateurs"></section>
<aside id="dossier" class="glass reveal d3" aria-label="Dossier de zone"></aside>
<section id="fleet" class="glass reveal d4" aria-label="Exposition">
  <div class="fh"><h2>Exposition</h2>
    <div class="tabs" id="tabs"><button data-t="in" class="on">Dans la zone<b>0</b></button><button data-t="appr">En approche<b>0</b></button><button data-t="dark" class="al">Sans AIS<b>0</b></button></div>
    <span class="tot" id="fleetTot"></span>
    <button class="ibtn" id="fleetMin" title="Réduire / déplier"><svg class="i" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button></div>
  <div id="fleetBody"></div>
</section>
<nav id="tools" class="glass reveal d2" aria-label="Commandes de vue">
  <button id="tZin" title="Zoomer"><svg class="i" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
  <button id="tZout" title="Dézoomer"><svg class="i" viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
  <hr>
  <button id="tHome" title="Vue d'ensemble"><svg class="i" viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5V13h-11z"/></svg></button>
  <button id="tStrait" title="Vue rasante du détroit"><svg class="i" viewBox="0 0 16 16"><path d="M1.5 11.5 6 6l3 3 2-2 3.5 4.5"/><circle cx="11.5" cy="4" r="1.3"/></svg></button>
  <button id="tTop" title="Vue de dessus (comme la carte)"><svg class="i" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1"/><path d="M2.5 8h11M8 2.5v11"/></svg></button>
  <button id="tRot" class="on" title="Rotation lente"><svg class="i" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v2.8h-2.8"/></svg></button>
  <button id="tReplay" title="Rejouer la plongée"><svg class="i" viewBox="0 0 16 16"><path d="M8 2v9M4.5 7.5 8 11l3.5-3.5M3 14h10"/></svg></button>
  <hr>
  <button id="tLayers" title="Calques et rendu"><svg class="i" viewBox="0 0 16 16"><path d="M8 2 14 5.2 8 8.4 2 5.2z"/><path d="m2 8 6 3.2L14 8M2 10.8 8 14l6-3.2"/></svg></button>
</nav>
<section id="layers" class="glass" aria-label="Calques">
  <div class="cap">Thème</div>
  <div class="segc" id="segTheme"><button data-v="">SOMBRE</button><button data-v="clair">CLAIR</button></div>
  <div class="cap">Calques</div>
  <label class="tg"><input type="checkbox" data-l="sat" checked>Satellites et emprises</label>
  <label class="tg"><input type="checkbox" data-l="stack" checked>Calques de sources</label>
  <label class="tg"><input type="checkbox" data-l="sweep" checked>Balayage de zone</label>
  <label class="tg"><input type="checkbox" data-l="grid" checked>Maillage géographique</label>
  <label class="tg"><input type="checkbox" data-l="trails" checked>Sillages (3 h)</label>
  <label class="tg"><input type="checkbox" data-l="labels" checked>Étiquettes</label>
  <div class="cap">Rendu</div>
  <label class="tg"><input type="checkbox" id="bloomTg" checked>Lueur</label>
  <div class="sl"><span>Exagération du relief</span><output id="exO">×1,0</output><input type="range" id="ex" min="0" max="2.5" step="0.1" value="1"></div>
  <div class="sl"><span>Vitesse de simulation</span><output id="spO">×1</output><input type="range" id="sp" min="0" max="4" step="0.5" value="1"></div>
</section>
<div id="callout"></div>
<div id="toast"></div>
<div id="nowebgl">CETTE VUE NÉCESSITE WEBGL 2</div>

<script>

$('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return; const q = e.target.value.trim().toLowerCase(); if (!q) return;
  const s = ships.find(x => (x.ais || x.detected) && (x.name.toLowerCase().includes(q) || x.carrier.toLowerCase().includes(q))); if (s) { select(s, true); e.target.blur(); }
});
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
  if (e.key === 'Escape') { select(null); $('layers').classList.remove('open'); $('tLayers').classList.remove('on'); }
});

/* ================================================================ intro : de la carte à plat à la maquette */
function startIntro() {
  document.body.classList.remove('ready'); select(null); tween = null; follow = null;
  Object.assign(cam, VIEWS.start); intro = { t0: performance.now(), dur: 5200 };
}

/* ================================================================ démarrage */
applyRelief();
recolor();
renderDossier(); seedFeed();
addEventListener('resize', resize); resize();
// pré-simulation : la scène s'ouvre avec des sillages tracés et un historique de passages
{ const step = .25; for (let i = 0; i < 48; i++) { simMs += step * 1000 * RATE; updateShips(step, i * step); updateSats(step); } }
presim = false;
if (STILL) document.body.classList.add('ready'); else startIntro();
placeCamera(); renderKpis(); renderFleet(true); $('clock').textContent = hhmm(simMs); resize();
if (document.fonts) document.fonts.ready.then(resize);
let tPrev = performance.now(), tAcc = 0, uiAcc = 0, fpsAcc = 0, fpsN = 0, autoBloom = true;
function frame(now) {
  const dt = Math.min(.05, (now - tPrev) / 1000); tPrev = now; tAcc += dt;
  simMs += dt * 1000 * RATE * simSpeed;
  if (intro) {
    const k = clamp((now - intro.t0) / intro.dur, 0, 1), e = easeIO(k), f = VIEWS.home, s = VIEWS.start;
    cam.R = s.R + (f.R - s.R) * e; cam.theta = s.theta + (f.theta - s.theta) * e;
    cam.phi = s.phi + (f.phi - s.phi) * easeIO(clamp((k - .2) / .8, 0, 1));
    cam.tx = f.tx; cam.tz = f.tz; cam.ty = s.ty + (f.ty - s.ty) * e;
    if (k >= 1) { intro = null; lastInput = now; document.body.classList.add('ready'); setTimeout(resize, 50); }
  } else if (tween) {
    const k = clamp((now - tween.t0) / tween.dur, 0, 1), e = easeIO(k);
    for (const key of Object.keys(tween.to)) cam[key] = tween.from[key] + (tween.to[key] - tween.from[key]) * e;
    if (k >= 1) { tween = null; lastInput = now; }
  } else if (autoRot && !follow && now - lastInput > 6000) cam.theta += dt * .02;
  placeCamera();
  U.uTime.value = tAcc; U.uSweep.value = (tAcc * .9) % (Math.PI * 2);
  wallMat.uniforms.uT.value = tAcc;
  beacon.userData.head.rotation.y = tAcc * 1.2; beacon.userData.head.position.y = 66 + Math.sin(tAcc * 2) * 2;
  updateShips(dt, tAcc); updateSats(dt); updateSelection(tAcc);
  SATS.forEach((S, i) => { S.g.rotation.z = Math.sin(tAcc * .5 + i) * .05; });
  uiAcc += dt; if (uiAcc > .5) { uiAcc = 0; renderKpis(); renderFleet(); $('clock').textContent = hhmm(simMs); }
  placeLabels(intro ? clamp(((now - intro.t0) / intro.dur - .65) / .35, 0, 1) : 1);
  post.render();
  // garde-fou de fluidité : sans carte graphique, on coupe la lueur plutôt que de saccader
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 3) { if (autoBloom && fpsN / fpsAcc < 24 && post.on && !STILL) { post.on = false; $('bloomTg').checked = false; } fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__focus = { ships, cam, select, sats: SATS, ready: () => !intro, flyTo, VIEWS, post, setTime: s => { for (let i = 0; i < s * 4; i++) { simMs += 250 * RATE; updateShips(.25, i * .25); updateSats(.25); } } };
</script>
