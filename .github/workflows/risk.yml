# VIGIE — actualisation horaire des scores de risque.
# Ce fichier doit vivre sur la branche PAR DÉFAUT du dépôt pour que le cron démarre.
name: VIGIE — actualisation du risque

on:
  schedule:
    - cron: '7 * * * *'        # toutes les heures, à h+7
  workflow_dispatch:            # + déclenchement manuel pour les tests

permissions:
  contents: write

concurrency:
  group: vigie-risk
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code du pipeline (branche de travail)
        uses: actions/checkout@v4
        with:
          ref: claude/ship-geopolitical-risk-tracker-qi9asb

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Récupérer le site (branche gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Calculer les scores
        run: node risk/pipeline.mjs --out site/risk.json --history site/history.json

      - name: Publier risk.json sur le site
        run: |
          cd site
          git config user.name "vigie-bot"
          git config user.email "vigie-bot@users.noreply.github.com"
          git add risk.json history.json
          git diff --cached --quiet || git commit -m "risk: actualisation $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
