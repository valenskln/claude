name: debug-asam (temporaire)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trouver la base URL de fetchData() et tester
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -m 20 -A "$UA" "https://msi.nga.mil/static/js/main.aed59dd5.js" -o /tmp/bundle.js
          echo "--- contexte autour de fetchData( definition/baseURL ---"
          grep -oE '.{60}fetchData=.{160}' /tmp/bundle.js | head -10
          grep -oE '.{60}baseURL.{100}' /tmp/bundle.js | head -10
          grep -oE '.{40}axios\.create.{160}' /tmp/bundle.js | head -10
          grep -oE '"https?://[a-zA-Z0-9_./:-]*msi[a-zA-Z0-9_./:-]*"' /tmp/bundle.js | sort -u | head -20
          echo "--- classe ur / xo (contient fetchData) ---"
          grep -oE 'class [A-Za-z0-9_]{1,4}\{[^}]{0,50}fetchData' /tmp/bundle.js | head -10
          echo "--- test avec base /api-query/ et /msi-api/ ---"
          for u in \
            "https://msi.nga.mil/api-query/publications/asam/areas" \
            "https://msi.nga.mil/msi-api/publications/asam/areas" \
            "https://msi.nga.mil/rest/publications/asam/areas" \
            "https://msi.nga.mil/api/publications/asam/areas?output=json" \
            "https://msi.nga.mil/api/publications/broadcast-warn/current-warnings"
          do
            echo "=== $u ==="
            code=$(curl -sS -m 15 -A "$UA" -o /tmp/out.txt -w "%{http_code}" "$u")
            echo "HTTP $code"
            head -c 200 /tmp/out.txt
            echo
          done
