name: debug-asam (temporaire)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trouver le vrai endpoint JSON depuis le bundle JS de /Piracy
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "--- HTML complet de /Piracy ---"
          curl -sS -m 15 -A "$UA" "https://msi.nga.mil/Piracy" -o /tmp/piracy.html
          cat /tmp/piracy.html
          echo
          echo "--- scripts référencés ---"
          grep -oE '(src|href)="[^"]*\.(js|json)[^"]*"' /tmp/piracy.html | sort -u
          echo
          echo "--- tentative main bundle (static/js) ---"
          for js in $(grep -oE 'src="[^"]*main[^"]*\.js"' /tmp/piracy.html | sed 's/src="//;s/"$//'); do
            url="$js"
            case "$js" in
              /*) url="https://msi.nga.mil$js" ;;
            esac
            echo "=== $url ==="
            curl -sS -m 20 -A "$UA" "$url" -o /tmp/bundle.js
            wc -c /tmp/bundle.js
            grep -oE '"[a-zA-Z0-9_/.-]*asam[a-zA-Z0-9_/.-]*"' /tmp/bundle.js | sort -u | head -40
          done
